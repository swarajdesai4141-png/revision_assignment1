
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Portal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="student.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">ABC College</a>

        <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Courses</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Admission</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Heading -->
<div class="container mt-4">
    <div class="text-center">
        <h2 class="text-primary fw-bold">Student Admission Form</h2>
        <p>Apply for admission to ABC College</p>
    </div>

    <!-- Admission Form -->
    <div class="form-container">
        <form>

            <h5 class="text-primary mb-3">Personal Information</h5>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control"
                    placeholder="Enter first name" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control"
                    placeholder="Enter last name" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text">@</span>
                        <input type="email" class="form-control"
                        placeholder="Enter email" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Mobile Number</label>
                    <input type="tel" class="form-control"
                    placeholder="Enter mobile number" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Date of Birth</label>
                <input type="date" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Gender</label><br>

                <div class="form-check form-check-inline">
                    <input type="radio" name="gender"
                    class="form-check-input" required>
                    <label class="form-check-label">Male</label>
                </div>

                <div class="form-check form-check-inline">
                    <input type="radio" name="gender"
                    class="form-check-input">
                    <label class="form-check-label">Female</label>
                </div>

                <div class="form-check form-check-inline">
                    <input type="radio" name="gender"
                    class="form-check-input">
                    <label class="form-check-label">Other</label>
                </div>
            </div>

            <hr>

            <h5 class="text-primary mb-3">Academic Information</h5>

            <div class="mb-3">
                <label class="form-label">Select Course</label>
                <select class="form-select" required>
                    <option value="">Choose Course</option>
                    <option>B.Tech Computer Engineering</option>
                    <option>BCA</option>
                    <option>BBA</option>
                    <option>B.Sc Computer Science</option>
                    <option>MCA</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Previous Qualification</label>
                <select class="form-select">
                    <option>Select Qualification</option>
                    <option>12th Science</option>
                    <option>12th Commerce</option>
                    <option>Diploma</option>
                    <option>Graduate</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea class="form-control" rows="3"
                placeholder="Enter your address"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Upload Documents</label>
                <input type="file" class="form-control" multiple>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input"
                id="agree" required>
                <label class="form-check-label" for="agree">
                    I agree to the terms and conditions.
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Submit Application
            </button>

            <button type="reset" class="btn btn-secondary w-100 mt-2">
                Reset Form
            </button>

        </form>
    </div>
</div>

<footer class="bg-primary text-white text-center p-3 mt-5">
    <p class="mb-0">© 2026 ABC College | Student Admission Portal</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
